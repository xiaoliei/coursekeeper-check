<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="1280" height="1050" rx="0" fill="#f5f7fc"/><text x="55" y="62" font-size="30" fill="#17233d" font-weight="700">课程任务管家</text><text x="56" y="92" font-size="14" fill="#758199" font-weight="400">四页导航与关键流程 · 基础版首轮设计 · A 主责</text><text x="55" y="143" font-size="16" fill="#17233d" font-weight="700">01  首次使用</text><rect x="55" y="167" width="235" height="88" rx="14" fill="white" stroke="#dfe6f1"/><text x="75" y="202" font-size="17" fill="#17233d" font-weight="700">打开应用</text><text x="75" y="229" font-size="12" fill="#758199" font-weight="400">引导可跳过</text><rect x="376" y="167" width="270" height="88" rx="14" fill="white" stroke="#dfe6f1"/><text x="396" y="202" font-size="17" fill="#17233d" font-weight="700">连接学校</text><text x="396" y="229" font-size="12" fill="#758199" font-weight="400">选学校 → 官方页登录 → 同步</text><rect x="732" y="167" width="240" height="88" rx="14" fill="white" stroke="#dfe6f1"/><text x="752" y="202" font-size="17" fill="#17233d" font-weight="700">首页</text><text x="752" y="229" font-size="12" fill="#758199" font-weight="400">缓存优先，数据就绪后展示</text><path d="M290 207L375 207" fill="none" stroke="#7891be" stroke-width="2"/><path d="M365.0 202.0L375 207L365.0 212.0" fill="none" stroke="#7891be" stroke-width="2"/><path d="M647 207L731 207" fill="none" stroke="#7891be" stroke-width="2"/><path d="M721.0 202.0L731 207L721.0 212.0" fill="none" stroke="#7891be" stroke-width="2"/><path d="M173 255V292H852V255M847 265L852 255L857 265" fill="none" stroke="#7891be" stroke-width="2"/><rect x="356" y="279" width="287" height="26" rx="0" fill="#f5f7fc"/><text x="368" y="298" font-size="12" fill="#60789d" font-weight="400">先手动使用／关闭登录 → 首页空状态</text><text x="55" y="357" font-size="16" fill="#17233d" font-weight="700">02  固定底部导航  四个入口始终可切换</text><rect x="55" y="383" width="260" height="145" rx="15" fill="white" stroke="#dfe6f1"/><rect x="55" y="383" width="260" height="5" rx="2" fill="#315efb"/><text x="75" y="422" font-size="20" fill="#17233d" font-weight="700">首页</text><rect x="258" y="401" width="37" height="26" rx="7" fill="#eaf0ff"/><text x="272" y="419" font-size="12" fill="#315efb" font-weight="700">A</text><text x="75" y="461" font-size="13" fill="#758199" font-weight="400">今日概览与下一节课</text><text x="75" y="490" font-size="13" fill="#758199" font-weight="400">近期截止与本周进度</text><rect x="358" y="383" width="260" height="145" rx="15" fill="white" stroke="#dfe6f1"/><rect x="358" y="383" width="260" height="5" rx="2" fill="#315efb"/><text x="378" y="422" font-size="20" fill="#17233d" font-weight="700">课表</text><rect x="561" y="401" width="37" height="26" rx="7" fill="#eaf0ff"/><text x="575" y="419" font-size="12" fill="#315efb" font-weight="700">B</text><text x="378" y="461" font-size="13" fill="#758199" font-weight="400">按教学周查看排课</text><text x="378" y="490" font-size="13" fill="#758199" font-weight="400">课程详情与手动维护</text><rect x="661" y="383" width="260" height="145" rx="15" fill="white" stroke="#dfe6f1"/><rect x="661" y="383" width="260" height="5" rx="2" fill="#315efb"/><text x="681" y="422" font-size="20" fill="#17233d" font-weight="700">任务</text><rect x="864" y="401" width="37" height="26" rx="7" fill="#eaf0ff"/><text x="878" y="419" font-size="12" fill="#315efb" font-weight="700">D</text><text x="681" y="461" font-size="13" fill="#758199" font-weight="400">截止排序与任务筛选</text><text x="681" y="490" font-size="13" fill="#758199" font-weight="400">新增、编辑与完成</text><rect x="964" y="383" width="260" height="145" rx="15" fill="white" stroke="#dfe6f1"/><rect x="964" y="383" width="260" height="5" rx="2" fill="#315efb"/><text x="984" y="422" font-size="20" fill="#17233d" font-weight="700">数据看板</text><rect x="1167" y="401" width="37" height="26" rx="7" fill="#eaf0ff"/><text x="1181" y="419" font-size="12" fill="#315efb" font-weight="700">F</text><text x="984" y="461" font-size="13" fill="#758199" font-weight="400">完成率与任务类型</text><text x="984" y="490" font-size="13" fill="#758199" font-weight="400">截止分布与压力规则</text><text x="55" y="564" font-size="12" fill="#315efb" font-weight="700">跨页入口</text><text x="150" y="564" font-size="13" fill="#17233d" font-weight="400">首页课程卡 → 课程详情    今日截止／已完成 → 任务筛选    本周概览 → 数据看板</text><text x="55" y="617" font-size="16" fill="#17233d" font-weight="700">03  任务操作路径</text><rect x="55" y="641" width="260" height="90" rx="14" fill="white" stroke="#dfe6f1"/><text x="73" y="678" font-size="17" fill="#17233d" font-weight="700">手动添加任务</text><text x="73" y="706" font-size="12" fill="#758199" font-weight="400">名称、课程、类型、截止时间</text><rect x="398" y="641" width="260" height="90" rx="14" fill="white" stroke="#dfe6f1"/><text x="416" y="678" font-size="17" fill="#17233d" font-weight="700">保存并校验</text><text x="416" y="706" font-size="12" fill="#758199" font-weight="400">必填与日期校验由任务业务层处理</text><rect x="741" y="641" width="483" height="90" rx="14" fill="white" stroke="#dfe6f1"/><text x="759" y="678" font-size="17" fill="#17233d" font-weight="700">更新相关页面</text><text x="759" y="706" font-size="12" fill="#758199" font-weight="400">任务清单 → 首页数字 → 看板统计 → 提醒安排</text><path d="M315 686L396 686" fill="none" stroke="#7891be" stroke-width="2"/><path d="M386.0 681.0L396 686L386.0 691.0" fill="none" stroke="#7891be" stroke-width="2"/><path d="M658 686L739 686" fill="none" stroke="#7891be" stroke-width="2"/><path d="M729.0 681.0L739 686L729.0 691.0" fill="none" stroke="#7891be" stroke-width="2"/><text x="55" y="787" font-size="16" fill="#17233d" font-weight="700">04  公共状态与恢复</text><rect x="55" y="812" width="260" height="118" rx="14" fill="white" stroke="#dfe6f1"/><text x="73" y="845" font-size="16" fill="#17233d" font-weight="700">离线</text><text x="73" y="878" font-size="12" fill="#758199" font-weight="400">显示轻提示，保留现有记录</text><text x="73" y="902" font-size="12" fill="#758199" font-weight="400">仍能查看、手动添加和完成任务</text><rect x="358" y="812" width="260" height="118" rx="14" fill="white" stroke="#dfe6f1"/><text x="376" y="845" font-size="16" fill="#17233d" font-weight="700">登录过期</text><text x="376" y="878" font-size="12" fill="#758199" font-weight="400">展示非阻断横幅，点击重登</text><text x="376" y="902" font-size="12" fill="#758199" font-weight="400">关闭登录后继续使用已有数据</text><rect x="661" y="812" width="260" height="118" rx="14" fill="white" stroke="#dfe6f1"/><text x="679" y="845" font-size="16" fill="#17233d" font-weight="700">部分成功</text><text x="679" y="878" font-size="12" fill="#758199" font-weight="400">保留成功同步的课程或任务</text><text x="679" y="902" font-size="12" fill="#758199" font-weight="400">失败模块可重试，支持手动补录</text><rect x="964" y="812" width="260" height="118" rx="14" fill="white" stroke="#dfe6f1"/><text x="982" y="845" font-size="16" fill="#17233d" font-weight="700">空数据</text><text x="982" y="878" font-size="12" fill="#758199" font-weight="400">显示解释和下一步操作</text><text x="982" y="902" font-size="12" fill="#758199" font-weight="400">引导添加任务或连接学校</text><text x="55" y="985" font-size="12" fill="#315efb" font-weight="700">交接边界</text><text x="151" y="985" font-size="13" fill="#17233d" font-weight="400">A 负责导航、首页与公共交互；C 提供登录；E 提供数据和同步状态；B、D、F 提供业务接口。</text><text x="55" y="1018" font-size="12" fill="#758199" font-weight="400">本图用于确认页面关系。接口字段及统计口径见「首页数据与交接说明」。AI 对话按后续阶段独立接入。</text></svg>